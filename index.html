<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>فرم شوخی</title>
    <style>
        body { font-family: Tahoma, sans-serif; background-color: #f0f2f5; display: flex; justify-content: center; padding: 20px; }
        .container { background: white; padding: 20px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 100%; max-width: 400px; }
        h2 { text-align: center; }
        .input-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background-color: #007bff; color: white; border: none; border-radius: 8px; cursor: pointer; font-size: 16px; }
        #result { margin-top: 20px; padding: 15px; background: #e9ecef; border-radius: 8px; display: none; }
        .joke-text { font-size: 20px; font-weight: bold; color: red; text-align: center; }
    </style>
</head>
<body>

<div class="container">
    <h2>ثبت اطلاعات</h2>
    
    <div class="input-group">
        <label>نام:</label>
        <input type="text" id="firstName">
    </div>

    <div class="input-group">
        <label>نام خانوادگی:</label>
        <input type="text" id="lastName">
    </div>

    <div class="input-group">
        <label>وزن (کیلوگرم):</label>
        <input type="number" id="weight">
    </div>

    <button onclick="showJoke()">ذخیره اطلاعات</button>

    <div id="result">
        <div id="displayData" class="joke-text"></div>
    </div>
</div>

<script>
    function showJoke() {
        // ۱. گرفتن مقادیر
        const fName = document.getElementById('firstName').value;
        const lName = document.getElementById('lastName').value;
        const w = document.getElementById('weight').value;

        // ۲. چک کردن خالی نبودن
        if (fName === "" || lName === "" || w === "") {
            alert("لطفاً نام، نام خانوادگی و وزن را پر کن!");
            return;
        }

        // ۳. نمایش نتیجه
        const resultDiv = document.getElementById('result');
        const displayDiv = document.getElementById('displayData');

        resultDiv.style.display = 'block';
        
        // استفاده از بک‌تیک برای ساخت جمله
        displayDiv.innerText = w + " کیلو وزنته برو لاغر کن " + fName + " " + lName;
    }
</script>

</body>
</html>
